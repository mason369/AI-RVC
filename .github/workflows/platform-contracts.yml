name: Platform Contracts

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-contracts:
    name: ${{ matrix.os }} / Python 3.10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.10"
          cache: pip

      - name: Install Linux audio libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsamplerate0 libsndfile1

      - name: Install macOS audio library
        if: runner.os == 'macOS'
        run: |
          brew install libsamplerate
          echo "DYLD_LIBRARY_PATH=$(brew --prefix libsamplerate)/lib" >> "$GITHUB_ENV"

      - name: Install CPU PyTorch on Windows and Linux
        if: runner.os != 'macOS'
        run: python -m pip install torch==2.11.0 torchvision==0.26.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install PyTorch on macOS
        if: runner.os == 'macOS'
        run: python -m pip install torch==2.13.0 torchvision==0.28.0 torchaudio==2.11.0

      - name: Install contract-test dependencies
        run: python -m pip install "audio-separator[cpu]==0.47.0"

      - name: Verify installed separator dependencies
        run: |
          python -m pip check
          python -c "from importlib.metadata import version; from audio_separator.separator import Separator; assert version('audio-separator') == '0.47.0'"

      - name: Validate real separator configuration and audio export
        run: python -m unittest discover -s tests -p "test_audio_separator_upgrade.py"

      - name: Validate installer and deployment contracts
        run: |
          python -m unittest discover -s tests -p "test_install_requirements.py"
          python -m unittest discover -s tests -p "test_installer_torch_contracts.py"
          python -m unittest discover -s tests -p "test_cuda_install_architecture.py"
          python -m unittest discover -s tests -p "test_ffmpeg_runtime.py"
          python -m unittest discover -s tests -p "test_platform_support.py"
          python -m unittest discover -s tests -p "test_colab_notebook.py"
          python -m unittest discover -s tests -p "test_hf_entrypoint.py"
          python -m unittest discover -s tests -p "test_deployment_readiness.py"
          python -m unittest discover -s tests -p "test_upstream_line_endings.py"
          python -m unittest discover -s tests -p "test_packaged_upstream_integrity.py"
          python -m unittest discover -s tests -p "test_upstream_import_isolation.py"

      - name: Validate audio-separator provider routing
        run: >-
          python tests/test_model_defaults.py
          ModelDefaultTests.test_audio_separator_runtime_honors_explicit_cpu_selection
          ModelDefaultTests.test_audio_separator_runtime_routes_non_onnx_accelerators_to_cpu_ort
