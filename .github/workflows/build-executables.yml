name: Build Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '构建的标签；留空只构建当前分支，绝不覆盖最新 Release'
        required: false
        default: ''
      platform:
        # 发布动作单独选择；普通手动构建只生成 Actions 审核产物。
        description: '只构建指定平台'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - Windows
          - Linux
      variant:
        description: '只构建指定版本'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - CPU
          - GPU

      publish:
        description: '上传到指定标签的草稿 Release（必须先亲测确认）'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            variant: CPU
            platform: Windows
            pytorch_url: https://download.pytorch.org/whl/cpu
            torch_stack: torch==2.11.0 torchvision==0.26.0 torchaudio==2.11.0
            audio_separator_extra: cpu
            sep: ";"
            shell: pwsh
          - os: windows-latest
            variant: GPU
            platform: Windows
            pytorch_url: https://download.pytorch.org/whl/cu128
            torch_stack: torch==2.11.0 torchvision==0.26.0 torchaudio==2.11.0
            audio_separator_extra: gpu
            sep: ";"
            shell: pwsh
          - os: ubuntu-22.04
            variant: CPU
            platform: Linux
            pytorch_url: https://download.pytorch.org/whl/cpu
            torch_stack: torch==2.11.0 torchvision==0.26.0 torchaudio==2.11.0
            audio_separator_extra: cpu
            sep: ":"
            shell: bash
          - os: ubuntu-22.04
            variant: GPU
            platform: Linux
            pytorch_url: https://download.pytorch.org/whl/cu128
            torch_stack: torch==2.11.0 torchvision==0.26.0 torchaudio==2.11.0
            audio_separator_extra: gpu
            sep: ":"
            shell: bash

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.platform }}-${{ matrix.variant }}

    steps:
    - name: Select matrix entry
      id: selection
      shell: pwsh
      run: |
        $requestedPlatform = "${{ github.event.inputs.platform }}"
        $requestedVariant = "${{ github.event.inputs.variant }}"
        if ([string]::IsNullOrWhiteSpace($requestedPlatform)) {
          $requestedPlatform = "all"
        }
        if ([string]::IsNullOrWhiteSpace($requestedVariant)) {
          $requestedVariant = "all"
        }

        $platformMatches = $requestedPlatform -eq "all" -or $requestedPlatform -eq "${{ matrix.platform }}"
        $variantMatches = $requestedVariant -eq "all" -or $requestedVariant -eq "${{ matrix.variant }}"
        $shouldRun = "${{ github.event_name }}" -ne "workflow_dispatch" -or ($platformMatches -and $variantMatches)
        $shouldRunText = $shouldRun.ToString().ToLowerInvariant()
        "should_run=$shouldRunText" >> $env:GITHUB_OUTPUT
        Write-Host "Selected: $shouldRunText (${{ matrix.platform }}-${{ matrix.variant }})"

    - name: Checkout code
      if: steps.selection.outputs.should_run == 'true'
      uses: actions/checkout@v7.0.1
      with:
        ref: ${{ inputs.tag || github.ref }}

    - name: Validate release destination before building
      if: steps.selection.outputs.should_run == 'true' && (github.event_name == 'push' || inputs.publish)
      id: tag
      shell: bash
      env:
        REQUESTED_TAG: ${{ inputs.tag }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="$REQUESTED_TAG"
        if [ "${{ github.event_name }}" = "push" ]; then TAG="${GITHUB_REF#refs/tags/}"; fi
        if [ -z "$TAG" ] || [ "$TAG" != "v$(cat VERSION)" ]; then
          echo "发布必须显式指定与 VERSION 一致的标签" >&2
          exit 1
        fi
        test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
        test "$(gh release view "$TAG" --repo "${{ github.repository }}" --json isDraft -q .isDraft)" = true
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"

    - name: Set up Python
      if: steps.selection.outputs.should_run == 'true'
      uses: actions/setup-python@v7.0.0
      with:
        python-version: '3.10'

    - name: Install system dependencies (Linux)
      if: steps.selection.outputs.should_run == 'true' && runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libsndfile1 libsamplerate0 ffmpeg portaudio19-dev

    - name: Install FFmpeg (Windows)
      if: steps.selection.outputs.should_run == 'true' && runner.os == 'Windows'
      run: choco install ffmpeg -y

    - name: Install Python dependencies
      if: steps.selection.outputs.should_run == 'true'
      run: |
        python -m pip install -r pre-requirements.txt
        python -m pip install pyinstaller
        python -m pip install ${{ matrix.torch_stack }} --index-url ${{ matrix.pytorch_url }}
        python -m pip install -r requirements.txt
        python -c "import torch; print(f'PyTorch: {torch.__version__}, CUDA: {torch.cuda.is_available()}')"

    - name: Install audio-separator
      if: steps.selection.outputs.should_run == 'true'
      run: |
        python -m pip install "audio-separator[${{ matrix.audio_separator_extra }}]==0.47.0"
        python -m pip check
        python -c "import torch, torchvision, torchaudio; expected='${{ matrix.torch_stack }}'; actual='torch=={} torchvision=={} torchaudio=={}'.format(torch.__version__.split('+')[0], torchvision.__version__.split('+')[0], torchaudio.__version__.split('+')[0]); assert actual == expected, 'PyTorch stack changed after audio-separator install: expected {}, got {}'.format(expected, actual); print(actual)"

    - uses: actions/setup-node@v7.0.0
      if: steps.selection.outputs.should_run == 'true'
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: ui/multitrack/package-lock.json

    - name: Build bundled multitrack player
      if: steps.selection.outputs.should_run == 'true'
      shell: bash
      run: |
        cd ui/multitrack
        npm ci --no-audit --no-fund
        mkdir -p dist
        npm run build

    - name: Run full regression suite
      if: steps.selection.outputs.should_run == 'true'
      env:
        PYTHONIOENCODING: utf-8
        AI_RVC_DEVICE: cpu
      run: python -m unittest discover -s tests

    - name: Bundle FFmpeg runtime
      if: steps.selection.outputs.should_run == 'true'
      shell: bash
      run: |
        python - <<'PY'
        import os
        import shutil
        import stat
        import subprocess
        from pathlib import Path

        import imageio_ffmpeg

        def check_executable(executable: Path) -> None:
            result = subprocess.run([str(executable), "-version"], text=True, capture_output=True)
            if result.returncode != 0:
                details = "\n".join(
                    part.strip()
                    for part in (result.stdout, result.stderr)
                    if part and part.strip()
                )
                raise RuntimeError(f"{executable} failed -version:\n{details}")

        def resolve_ffprobe() -> Path:
            ffprobe_src = shutil.which("ffprobe")
            if not ffprobe_src:
                raise RuntimeError("ffprobe not found after installing FFmpeg")

            ffprobe_path = Path(ffprobe_src)
            if os.name == "nt":
                chocolatey_root = Path(os.environ.get("ChocolateyInstall", r"C:\ProgramData\chocolatey"))
                chocolatey_shim_dir = chocolatey_root / "bin"
                if ffprobe_path.parent.resolve() == chocolatey_shim_dir.resolve():
                    real_ffprobe = chocolatey_root / "lib" / "ffmpeg" / "tools" / "ffmpeg" / "bin" / "ffprobe.exe"
                    if not real_ffprobe.exists():
                        raise RuntimeError(f"Chocolatey ffprobe shim found, but real binary is missing: {real_ffprobe}")
                    return real_ffprobe

            return ffprobe_path

        bundle_dir = Path("tools/ffmpeg/bin")
        bundle_dir.mkdir(parents=True, exist_ok=True)

        ffmpeg_src = Path(imageio_ffmpeg.get_ffmpeg_exe())
        ffmpeg_name = "ffmpeg.exe" if os.name == "nt" else "ffmpeg"
        ffmpeg_dest = bundle_dir / ffmpeg_name
        shutil.copy2(ffmpeg_src, ffmpeg_dest)
        ffmpeg_dest.chmod(ffmpeg_dest.stat().st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)
        check_executable(ffmpeg_dest)
        print(f"Bundled ffmpeg: {ffmpeg_dest}")

        ffprobe_src = resolve_ffprobe()
        ffprobe_name = "ffprobe.exe" if os.name == "nt" else "ffprobe"
        ffprobe_dest = bundle_dir / ffprobe_name
        shutil.copy2(ffprobe_src, ffprobe_dest)
        ffprobe_dest.chmod(ffprobe_dest.stat().st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)
        subprocess.run([str(ffprobe_dest), "-version"], text=True, capture_output=True, check=True)
        print(f"Bundled ffprobe: {ffprobe_dest}")
        PY

    - name: Download all AI models
      if: steps.selection.outputs.should_run == 'true'
      shell: bash
      env:
        PYTHONIOENCODING: utf-8
      run: |
        echo "=== Download all models, separator defaults, and official RVC source ==="
        python tools/download_models.py --all
        python tools/package_runtime.py .

        echo "=== Verify downloaded models ==="
        find assets/ -name "*.pt" -o -name "*.pth" -o -name "*.ckpt" -o -name "*.onnx" | while read f; do
          SIZE=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
          echo "  $f ($(( SIZE / 1048576 )) MB)"
        done

    - name: Build executable
      if: steps.selection.outputs.should_run == 'true'
      shell: bash
      run: |
        python - "${{ matrix.variant }}" <<'PY'
        import json
        import sys
        from pathlib import Path

        retired_assets = [
            str(path) for path in Path("assets/separator_models").rglob("*")
            if path.is_file() and "polarformer" in str(path).lower()
        ]
        if retired_assets:
            raise RuntimeError(f"已移除模型仍出现在发行资产中: {retired_assets}")

        config_path = Path("configs/config.json")
        config = json.loads(config_path.read_text(encoding="utf-8"))
        config["device"] = "cpu" if sys.argv[1] == "CPU" else "cuda"
        config_path.write_text(
            json.dumps(config, ensure_ascii=False, indent=4) + "\n",
            encoding="utf-8",
        )
        print(f"Packaged device: {config['device']}")
        PY

        SEP="${{ matrix.sep }}"
        NAME="AI-RVC-${{ matrix.platform }}-${{ matrix.variant }}"
        pyinstaller --name "${NAME}" \
          --onedir \
          --add-data "ui${SEP}ui" \
          --add-data "infer${SEP}infer" \
          --add-data "lib${SEP}lib" \
          --add-data "models${SEP}models" \
          --add-data "tools${SEP}tools" \
          --add-data "i18n${SEP}i18n" \
          --add-data "configs${SEP}configs" \
          --add-data "_official_rvc_runtime${SEP}_official_rvc_runtime" \
          --add-data "rvc_mcp${SEP}rvc_mcp" \
          --add-data "assets/hubert_base${SEP}assets/hubert_base" \
          --add-data "assets/hubert${SEP}assets/hubert" \
          --add-data "assets/rmvpe${SEP}assets/rmvpe" \
          --add-data "assets/uvr5_weights${SEP}assets/uvr5_weights" \
          --add-data "assets/pretrained_v2${SEP}assets/pretrained_v2" \
          --add-data "assets/separator_models${SEP}assets/separator_models" \
          --hidden-import=torch \
          --hidden-import=torchaudio \
          --hidden-import=gradio \
          --hidden-import=librosa \
          --hidden-import=soundfile \
          --hidden-import=fairseq \
          --hidden-import=ffmpeg \
          --hidden-import=pyworld \
          --hidden-import=parselmouth \
          --hidden-import=torchcrepe \
          --hidden-import=faiss \
          --hidden-import=onnxruntime \
          --hidden-import=gdown \
          --collect-submodules audio_separator.separator \
          --collect-submodules audio_separator.separator.uvr_lib_v5.roformer \
          --collect-data audio_separator \
          --collect-data safehttpx \
          --collect-data groovy \
          --copy-metadata audio-separator \
          --hidden-import=demucs \
          --hidden-import=pedalboard \
          --collect-all torch \
          --collect-all torchaudio \
          --collect-all gradio \
          --collect-all gradio_client \
          --collect-all torchfcpe \
          --collect-all transformers \
          --collect-all rvc_mcp \
          --collect-all mcp \
          run.py

        EXE="dist/${NAME}/${NAME}"
        if [ "${{ matrix.platform }}" = "Windows" ]; then EXE="${EXE}.exe"; fi
        python tools/package_runtime.py "dist/${NAME}/_internal"
        "${EXE}" --internal-worker vc --help
        "${EXE}" --internal-worker uvr5 --help

    - name: Create portable package
      if: steps.selection.outputs.should_run == 'true'
      shell: bash
      run: |
        NAME="AI-RVC-${{ matrix.platform }}-${{ matrix.variant }}"
        PKG="${NAME}-Portable"
        mkdir -p "${PKG}"
        # onedir 输出在 dist/NAME/ 目录下，复制全部内容
        cp -r dist/${NAME}/* "${PKG}/"
        cp README.md "${PKG}/"
        cp CHANGELOG.md VERSION "${PKG}/"
        mkdir -p "${PKG}/docs"
        git ls-files -z docs | while IFS= read -r -d '' file; do
          mkdir -p "${PKG}/$(dirname "$file")"
          cp "$file" "${PKG}/$file"
        done
        [ -f LICENSE ] && cp LICENSE "${PKG}/"

        if [ "${{ matrix.variant }}" = "GPU" ]; then
          VARIANT_NOTE="GPU 版（CUDA 12.8），支持 NVIDIA 显卡加速
        必须使用可用的 NVIDIA CUDA 环境；CUDA 不可用时程序会明确报错并停止"
        else
          VARIANT_NOTE="CPU 版，无需显卡即可运行
        如需 GPU 加速，请下载 GPU 版本或使用本地安装方式：python install.py"
        fi

        if [ "${{ matrix.platform }}" = "Windows" ]; then
          EXE_NAME="${NAME}.exe"
          cat > "${PKG}/使用说明.txt" << HEREDOC
        AI-RVC ${{ matrix.platform }} 便携版（${{ matrix.variant }}）

        使用方法：
          双击 ${EXE_NAME} 启动
          浏览器访问 http://127.0.0.1:7860

        ${VARIANT_NOTE}

        基础与默认分离模型已内置；角色模型按需下载或导入
        无需安装 Python，解压即用
        HEREDOC
        else
          EXE_NAME="${NAME}"
          chmod +x "${PKG}/${EXE_NAME}"
          cat > "${PKG}/使用说明.txt" << HEREDOC
        AI-RVC ${{ matrix.platform }} 便携版（${{ matrix.variant }}）

        使用方法：
          chmod +x ${EXE_NAME}
          ./${EXE_NAME}
          浏览器访问 http://127.0.0.1:7860

        ${VARIANT_NOTE}

        基础与默认分离模型已内置；角色模型按需下载或导入
        无需安装 Python，解压即用
        HEREDOC
        fi

    - name: Inventory package contents
      if: steps.selection.outputs.should_run == 'true'
      run: python tools/release_manifest.py "AI-RVC-${{ matrix.platform }}-${{ matrix.variant }}-Portable"

    - name: Compress package
      if: steps.selection.outputs.should_run == 'true'
      shell: bash
      run: |
        NAME="AI-RVC-${{ matrix.platform }}-${{ matrix.variant }}"
        PKG="${NAME}-Portable"

        if [ "${{ matrix.platform }}" = "Windows" ]; then
          # 完整模型包直接生成无损分卷，避免重复压缩同一目录。
          7z a -t7z -v1900m "${PKG}.7z" "${PKG}"
        else
          tar -czf "${PKG}.tar.gz" "${PKG}"
          # 超过 1.9GB 时拆分
          FILE_SIZE=$(stat -c%s "${PKG}.tar.gz" 2>/dev/null || stat -f%z "${PKG}.tar.gz")
          if [ "$FILE_SIZE" -gt 1900000000 ]; then
            split -b 1900M "${PKG}.tar.gz" "${PKG}.tar.gz.part"
            rm "${PKG}.tar.gz"
          fi
        fi

    - name: Write archive checksums
      if: steps.selection.outputs.should_run == 'true'
      shell: bash
      run: |
        PKG="AI-RVC-${{ matrix.platform }}-${{ matrix.variant }}-Portable"
        mapfile -d '' -t FILES < <(find . -maxdepth 1 -type f \( -name "${PKG}.zip" -o -name "${PKG}.7z*" -o -name "${PKG}.tar.gz*" \) -print0 | sort -z)
        test "${#FILES[@]}" -gt 0
        sha256sum "${FILES[@]}" > "${PKG}.SHA256SUMS"

    - name: Upload artifact
      if: steps.selection.outputs.should_run == 'true'
      uses: actions/upload-artifact@v7.0.1
      with:
        name: AI-RVC-${{ matrix.platform }}-${{ matrix.variant }}
        path: |
          AI-RVC-${{ matrix.platform }}-${{ matrix.variant }}-Portable.zip
          AI-RVC-${{ matrix.platform }}-${{ matrix.variant }}-Portable.7z
          AI-RVC-${{ matrix.platform }}-${{ matrix.variant }}-Portable.7z.*
          AI-RVC-${{ matrix.platform }}-${{ matrix.variant }}-Portable.tar.gz
          AI-RVC-${{ matrix.platform }}-${{ matrix.variant }}-Portable.tar.gz.part*
          AI-RVC-${{ matrix.platform }}-${{ matrix.variant }}-Portable.SHA256SUMS
        if-no-files-found: error
        compression-level: 0

    - name: Upload assets to release
      if: steps.selection.outputs.should_run == 'true' && steps.tag.outputs.tag != ''
      shell: bash
      run: |
        NAME="AI-RVC-${{ matrix.platform }}-${{ matrix.variant }}"
        PKG="${NAME}-Portable"
        TAG="${{ steps.tag.outputs.tag }}"
        echo "上传资源到 Release: ${TAG}"
        mapfile -t FILES < <(
          find . -maxdepth 1 -type f \( \
            -name "${PKG}.zip" -o \
            -name "${PKG}.7z" -o \
            -name "${PKG}.7z.*" -o \
            -name "${PKG}.tar.gz" -o \
            -name "${PKG}.tar.gz.part*" -o \
            -name "${PKG}.SHA256SUMS" \
          \) | sort
        )
        if [ "${#FILES[@]}" -eq 0 ]; then
          echo "没有找到可上传的压缩产物: ${PKG}"
          exit 1
        fi
        upload_asset_with_retry() {
          local tag="$1"
          local file="$2"
          local attempt
          local exit_code

          for attempt in 1 2 3; do
            echo "上传(${attempt}/3): ${file}"
            if timeout 30m gh release upload "${tag}" "${file}" --repo "${{ github.repository }}" --clobber; then
              return 0
            else
              exit_code=$?
            fi
            echo "上传失败(退出码=${exit_code}): ${file}"
            if [ "${attempt}" -lt 3 ]; then
              sleep $(( attempt * 20 ))
            fi
          done

          echo "上传最终失败: ${file}"
          return 1
        }
        echo "找到以下文件："
        for f in "${FILES[@]}"; do
          SIZE=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
          echo "  $f ($(( SIZE / 1048576 )) MB)"
        done
        # 逐个上传
        for f in "${FILES[@]}"; do
          upload_asset_with_retry "${TAG}" "$f"
        done
        echo "全部上传完成"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
